<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <title>Workers</title>
  </head>
  <body>
    <header class="bg-white py-4 px-4">
      <section class="flex items-center justify-between max-w-300 mx-auto">
        <span class="text-red-500 font-bold text-xl">WorkForMe</span>

        <nav class="hidden md:block">
          <ul class="flex items-center gap-5">
            <li><a href="./index.html">Home</a></li>
            <li><a href="./workers.html">Workers</a></li>
            <li><a href="">About</a></li>
            <li><a href="">Contact</a></li>
          </ul>
        </nav>

        <div class="flex items-center">
          <button
            class="hidden md:block bg-red-500 px-5 py-2 rounded-md text-white text-xl font-semibold"
          >
            Login
          </button>

          <button id="menuBtn" class="md:hidden">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="#1f1f1f"
            >
              <path
                d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"
              />
            </svg>
          </button>
        </div>
      </section>

      <nav id="smallNav" class="hidden flex-col gap-5 mt-5">
        <ul class="flex flex-col items-start gap-5 md:hidden">
          <li><a href="">Home</a></li>
          <li><a href="">Workers</a></li>
          <li><a href="">About</a></li>
          <li><a href="">Contact</a></li>
        </ul>
        <button
          class="bg-red-500 px-5 py-2 rounded-md text-white text-xl font-semibold"
        >
          Login
        </button>
      </nav>
    </header>

    <section
      class="flex flex-col items-center justify-center gap-5 py-20 md:py-30 px-4 bg-red-50"
    >
      <h1 class="font-extrabold text-4xl text-center">
        Meet Our <span class="text-red-500">Artisans</span>
      </h1>
      <p class="text-xl text-gray-700 w-full md:w-[70%] lg:w-[40%] text-center">
        Discover professional woodworkers, electricians, mechanics, and plumbers
        ready for your projects.
      </p>
    </section>

    <section class="bg-white py-15 px-4">
      <div class="max-w-300 mx-auto">
        <div class="relative mx-auto">
          <button class="absolute top-4 left-3">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="20px"
              viewBox="0 -960 960 960"
              width="20px"
              fill="#999999"
            >
              <path
                d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"
              />
            </svg>
          </button>
          <input
            type="text"
            id="searchBar"
            placeholder="Search by name or role..."
            class="border border-gray-100 rounded-full shadow-sm py-3 pr-5 pl-10 focus:outline-red-400 w-full"
          />
        </div>

        <div class="flex items-center justify-center gap-4 my-6">
          <button
            class="py-2 px-5 rounded-full bg-red-600 text-white shadow-md border"
          >
            All Roles
          </button>
          <button
            class="py-2 px-5 rounded-full text-gray-800 bg-white shadow-md border"
          >
            Electrician
          </button>
          <button
            class="py-2 px-5 rounded-full text-gray-800 bg-white shadow-md border"
          >
            Plumber
          </button>
          <button
            class="py-2 px-5 rounded-full text-gray-800 bg-white shadow-md border"
          >
            Mechanic
          </button>
        </div>

        <div class="py-10">
          <p class="text-gray-700 text-center font-medium">
            Showing 10 artisans
          </p>

          <div
            id="workerSection"
            class="grid grid-col-1 md:grid-cols-3 gap-6 items-center mt-5"
          ></div>
        </div>
      </div>
    </section>

    <footer class="bg-gray-800 py-10 px-4 text-center">
      <p class="text-white">
        &copy; <span id="year"></span> WorkForMe. All rights reserved.
      </p>
    </footer>

    <script src="./js/header.js"></script>
    <script src="./js/footer.js"></script>
    <script src="./js/workers.js"></script>
  </body>
</html>
